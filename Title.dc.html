<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&amp;family=Nunito:wght@600;700;800&amp;display=swap">
  <style>
    body { margin: 0; background: #d8d3c8; }
    a { color: #b45309; } a:hover { color: #92400e; }
  </style>
</helmet>

<div style="position: absolute; width: 900px; height: 600px; overflow: hidden; background: linear-gradient(180deg, #6FC0DE 0%, #3D9BC4 34%, #24749B 100%); font-family: 'Nunito', 'Segoe UI', sans-serif; left: -57px; top: -35px">

  <!-- distant island silhouette, sitting on the horizon -->
  <div style="position: absolute; left: 596px; top: 96px; width: 240px; height: 74px; border-radius: 120px 120px 0 0; background: rgba(20,72,100,0.30);"></div>
  <div style="position: absolute; left: 74px; top: 118px; width: 150px; height: 52px; border-radius: 80px 80px 0 0; background: rgba(20,72,100,0.22);"></div>

  <!-- wave bands instead of stray white circles -->
  <sc-for list="{{waves}}" as="w" hint-placeholder-count="5">
    <div style="position: absolute; left: {{w.x}}px; top: {{w.y}}px; width: {{w.len}}px; height: 4px; border-radius: 2px; background: rgba(255,255,255,{{w.a}});"></div>
  </sc-for>

  <!-- title -->
  <div style="position: absolute; left: 0; top: 82px; width: 900px; text-align: center;">
    <div style="font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-size: 30px; font-weight: 700; letter-spacing: 0.34em; color: #FFE7A8; text-shadow: 0 2px 0 rgba(20,62,86,0.5);">PIRATE ISLAND</div>
    <div style="margin-top: 2px; font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-size: 76px; font-weight: 800; line-height: 1.02; color: #FFF6E2; text-shadow: 0 4px 0 #7A4E12, 0 8px 0 #52320A, 0 14px 22px rgba(12,48,70,0.45);">Coin Hunt</div>
  </div>

  <!-- overall best banner -->
  <div style="position: absolute; left: 0; top: 236px; width: 900px; display: flex; justify-content: center;">
    <div style="display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 22px; border-radius: 20px; background: linear-gradient(180deg, #F7CE47 0%, #DEA82E 100%); box-shadow: 0 3px 0 #A9720F, 0 8px 16px rgba(12,48,70,0.3);">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#5A3C1E" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M 5 4 h 14 v 6 a 7 7 0 0 1 -14 0 z"></path>
        <path d="M 5 6 H 2.5 a 3.5 3.5 0 0 0 3.5 4"></path>
        <path d="M 19 6 h 2.5 a 3.5 3.5 0 0 1 -3.5 4"></path>
        <path d="M 9 21 h 6"></path>
        <path d="M 12 17 v 4"></path>
      </svg>
      <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #7A4E12;">BEST ON THE ISLAND</span>
      <span style="font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-size: 20px; font-weight: 800; color: #322820; line-height: 1;">Marion · 330</span>
    </div>
  </div>

  <!-- player select: a face to pick, not a name in a yellow box -->
  <div style="position: absolute; left: 0; top: 300px; width: 900px; text-align: center; font-size: 17px; font-weight: 700; color: #EAF6FB; text-shadow: 0 2px 4px rgba(12,48,70,0.5);">Choose your pirate</div>

  <div style="position: absolute; left: 0; top: 336px; width: 900px; display: flex; justify-content: center; gap: 26px;">
    <sc-for list="{{players}}" as="p" hint-placeholder-count="3">
      <div style="width: 206px; padding: 18px 0 16px; border-radius: 22px; background: #FFFAEB; box-shadow: 0 5px 0 #5A3C1E, 0 14px 24px rgba(12,48,70,0.32); text-align: center;">
        <sc-if value="{{p.braided}}" hint-placeholder-val="{{false}}">
          <svg width="88" height="88" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="18" fill="{{p.tint}}"></circle>
            <path d="M 20 5.4 C 28.4 5.4 32.4 11.8 32.3 19.4 C 32.1 21.8 31.7 23.4 31.1 24.8 C 30.3 21.4 29.8 17.2 28 14.2 C 26.1 11 24 10 20 10 C 16 10 13.9 11 12 14.2 C 10.2 17.2 9.7 21.4 8.9 24.8 C 8.3 23.4 7.9 21.8 7.7 19.4 C 7.6 11.8 11.6 5.4 20 5.4 Z" fill="#5E3A22"></path>
            <circle cx="20" cy="25" r="12.4" fill="#C44A3A"></circle>
            <circle cx="20" cy="17" r="10" fill="#FFD6AA"></circle>
            <path d="M 10.4 14 C 8.9 16.8 8.2 19 7.6 22 C 7.1 25 6.8 27 6.8 29.4 L 10.3 29.6 C 10.3 27.2 10.6 25 11.1 22.2 C 11.6 19.4 12.4 16.8 13.8 14.6 Z" fill="#6E4327"></path>
            <path d="M 8.4 18.2 L 10.1 19.2 L 11.9 18 M 7.4 22.7 L 9 23.7 L 10.8 22.5 M 7 26.7 L 8.6 27.7 L 10.3 26.5" fill="none" stroke="#4A2C19" stroke-width="0.9" stroke-linecap="round" stroke-linejoin="round"></path>
            <path d="M 6.8 28.8 L 10.3 29 L 10.3 31 L 6.8 30.8 Z" fill="{{p.bandana}}"></path>
            <path d="M 7 30.9 L 10.2 31.1 L 9.2 33.2 L 8.4 32 L 7.6 32.9 Z" fill="#5E3A22"></path>
            <path d="M 10 15 a 10 10 0 0 1 20 0 z" fill="{{p.bandana}}"></path>
            <path d="M 10 15 L 30 15" stroke="rgba(0,0,0,0.18)" stroke-width="1.6"></path>
            <path d="M 30 13.6 l 6 -3 l -1.5 5 z" fill="{{p.bandana}}"></path>
            <path d="M 13.4 16.9 L 14.7 17.8 M 26.6 16.9 L 25.3 17.8" fill="none" stroke="#241814" stroke-width="1.1" stroke-linecap="round"></path>
            <circle cx="16.4" cy="19" r="2.4" fill="#241814"></circle>
            <circle cx="23.6" cy="19" r="2.4" fill="#241814"></circle>
            <path d="M 15.6 23.4 Q 20 26.6 24.4 23.4" fill="none" stroke="#3C281E" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </sc-if>
        <sc-if value="{{p.plain}}" hint-placeholder-val="{{true}}">
          <svg width="88" height="88" viewBox="0 0 40 40">
            <circle cx="20" cy="20" r="18" fill="{{p.tint}}"></circle>
            <circle cx="20" cy="25" r="12.4" fill="#C44A3A"></circle>
            <circle cx="20" cy="17" r="10" fill="#FFD6AA"></circle>
            <path d="M 10 15 a 10 10 0 0 1 20 0 z" fill="{{p.bandana}}"></path>
            <path d="M 10 15 L 30 15" stroke="rgba(0,0,0,0.18)" stroke-width="1.6"></path>
            <path d="M 30 13.6 l 6 -3 l -1.5 5 z" fill="{{p.bandana}}"></path>
            <circle cx="16.4" cy="19" r="2.4" fill="#241814"></circle>
            <circle cx="23.6" cy="19" r="2.4" fill="#241814"></circle>
            <path d="M 15.6 23.4 Q 20 26.6 24.4 23.4" fill="none" stroke="#3C281E" stroke-width="2" stroke-linecap="round"></path>
          </svg>
        </sc-if>
        <div style="margin-top: 8px; font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-size: 28px; font-weight: 800; color: #322820; line-height: 1;">{{p.name}}</div>
        <div style="margin-top: 6px; font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #8A6A44;">BEST {{p.best}}</div>
      </div>
    </sc-for>
  </div>

  <!-- controls, which the game never explains anywhere today -->
  <div style="position: absolute; left: 0; bottom: 22px; width: 900px; display: flex; justify-content: center; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; color: rgba(255,255,255,0.86);">
    <span style="display: inline-flex; gap: 3px;">
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,0.92); color: #24749B; box-shadow: 0 2px 0 rgba(12,48,70,0.45);">←</span>
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,0.92); color: #24749B; box-shadow: 0 2px 0 rgba(12,48,70,0.45);">↓</span>
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,0.92); color: #24749B; box-shadow: 0 2px 0 rgba(12,48,70,0.45);">↑</span>
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,0.92); color: #24749B; box-shadow: 0 2px 0 rgba(12,48,70,0.45);">→</span>
    </span>
    <span>or</span>
    <span style="display: inline-flex; gap: 3px;">
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,0.92); color: #24749B; box-shadow: 0 2px 0 rgba(12,48,70,0.45);">W</span>
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,0.92); color: #24749B; box-shadow: 0 2px 0 rgba(12,48,70,0.45);">A</span>
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,0.92); color: #24749B; box-shadow: 0 2px 0 rgba(12,48,70,0.45);">S</span>
      <span style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 6px; background: rgba(255,255,255,0.92); color: #24749B; box-shadow: 0 2px 0 rgba(12,48,70,0.45);">D</span>
    </span>
    <span>to move · collect every coin to sail on</span>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    // Real values from scores.json, not invented ones.
    // `braided` picks Marion's avatar; the flags are a matched pair because
    // sc-if has no else branch.
    const players = [
      { name: 'Adrien', best: 0, bandana: '#3E8FBF', tint: '#DCEFF7', braided: false },
      { name: 'Luc', best: 170, bandana: '#C82828', tint: '#FADFDA', braided: false },
      { name: 'Marion', best: 330, bandana: '#8A5BC4', tint: '#E9E0F7', braided: true }
    ].map((p) => ({ ...p, plain: !p.braided }));
    let seed = 77;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const waves = [];
    for (let i = 0; i < 26; i++) {
      waves.push({
        x: Math.floor(rnd() * 860),
        y: 170 + Math.floor(rnd() * 410),
        len: 22 + Math.floor(rnd() * 46),
        a: (0.08 + rnd() * 0.14).toFixed(2)
      });
    }
    return { players, waves };
  }
}
</script>
</body>
</html>
