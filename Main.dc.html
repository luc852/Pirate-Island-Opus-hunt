<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; background: #d8d3c8; }
    a { color: #b45309; } a:hover { color: #92400e; }
  </style>
</helmet>

<div style="position: relative; width: 900px; height: 600px; overflow: hidden; background: radial-gradient(120% 110% at 50% 46%, #4FA8CE 0%, #2E86AB 42%, #1B6389 100%); font-family: 'Nunito', 'Segoe UI', sans-serif;">

  <!-- sea swell -->
  <div style="position: absolute; inset: 0; background: repeating-linear-gradient(178deg, rgba(255,255,255,0) 0 21px, rgba(255,255,255,0.05) 21px 23px);"></div>

  <!-- island: rounded landmass with foam ring and damp shoreline -->
  <div style="position: absolute; left: 30px; top: 70px; width: 840px; height: 520px; border-radius: 20px; overflow: hidden; background: #EDC98A; box-shadow: 0 0 0 5px rgba(255,255,255,0.34), 0 0 0 11px rgba(255,255,255,0.14), 0 16px 38px rgba(10,48,70,0.34), inset 0 0 26px rgba(178,138,84,0.55);">
    <sc-for list="{{specks}}" as="s" hint-placeholder-count="40">
      <div style="position: absolute; left: {{s.x}}px; top: {{s.y}}px; width: {{s.d}}px; height: {{s.d}}px; border-radius: 50%; background: #DFB873;"></div>
    </sc-for>
  </div>

  <!-- walls: same crate DNA, consistent top-light bevel -->
  <sc-for list="{{walls}}" as="w" hint-placeholder-count="60">
    <div style="position: absolute; left: {{w.sx}}px; top: {{w.sy}}px; width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(180deg, #8A6647 0%, #6E5037 100%); box-shadow: 0 3px 0 #4E3625, 0 6px 9px rgba(58,34,18,0.28), inset 0 2px 0 rgba(255,232,200,0.22);">
      <div style="position: absolute; left: 7px; top: 7px; width: 26px; height: 26px; border-radius: 8px; background: linear-gradient(180deg, #9C7856 0%, #82603F 100%); box-shadow: inset 0 1px 0 rgba(255,236,206,0.28);"></div>
    </div>
  </sc-for>

  <!-- tide pools: pushed far darker than the sea so a hazard never reads as scenery -->
  <sc-for list="{{puddles}}" as="p" hint-placeholder-count="3">
    <div style="position: absolute; left: {{p.cx}}px; top: {{p.cy}}px; transform: translate(-50%, -50%);">
      <svg width="38" height="30" viewBox="0 0 38 30">
        <ellipse cx="19" cy="16" rx="17" ry="12" fill="#CFA971"></ellipse>
        <ellipse cx="19" cy="15" rx="16" ry="11" fill="#F3EBDA"></ellipse>
        <ellipse cx="19" cy="15" rx="14" ry="9.4" fill="#14506E"></ellipse>
        <ellipse cx="19" cy="16.2" rx="11.6" ry="7.4" fill="#1E6E96"></ellipse>
        <ellipse cx="15" cy="12.6" rx="3.6" ry="2.2" fill="#4FA0C4" opacity="0.75"></ellipse>
        <circle cx="24" cy="17" r="1.5" fill="#9FD6EA" opacity="0.9"></circle>
      </svg>
    </div>
  </sc-for>

  <!-- coins keep the Kenney sprite; a soft glow lifts them off the sand -->
  <sc-for list="{{coins}}" as="c" hint-placeholder-count="8">
    <div style="position: absolute; left: {{c.cx}}px; top: {{c.cy}}px; transform: translate(-50%, -50%);">
      <svg width="34" height="34" viewBox="0 0 34 34">
        <circle cx="17" cy="17" r="15" fill="#FFDC6A" opacity="0.28"></circle>
        <circle cx="17" cy="18" r="11.5" fill="#A9720F"></circle>
        <circle cx="17" cy="16.6" r="11.5" fill="#DEA82E"></circle>
        <circle cx="17" cy="16.6" r="9" fill="#F7CE47"></circle>
        <circle cx="17" cy="16.6" r="6" fill="none" stroke="#C08D1C" stroke-width="1.8"></circle>
        <path d="M 11 12 Q 14 9 18 9.5" fill="none" stroke="#FFF3C4" stroke-width="2" stroke-linecap="round"></path>
      </svg>
    </div>
  </sc-for>

  <!-- crabs: a silhouette that can never be mistaken for the pirate -->
  <sc-for list="{{monsters}}" as="m" hint-placeholder-count="2">
    <div style="position: absolute; left: {{m.cx}}px; top: {{m.cy}}px; transform: translate(-50%, -50%);">
      <svg width="38" height="34" viewBox="0 0 38 34">
        <ellipse cx="19" cy="29" rx="13" ry="3.4" fill="rgba(40,22,10,0.22)"></ellipse>
        <g stroke="#3F8F49" stroke-width="2.4" stroke-linecap="round">
          <path d="M 9 21 L 3 25"></path>
          <path d="M 9 24 L 5 29"></path>
          <path d="M 29 21 L 35 25"></path>
          <path d="M 29 24 L 33 29"></path>
        </g>
        <path d="M 8 15 a 5 5 0 1 1 4 5 l 0 -3 l 4 -1" fill="#4E9C58" stroke="#3F8F49" stroke-width="1.4" stroke-linejoin="round"></path>
        <path d="M 30 15 a 5 5 0 1 0 -4 5 l 0 -3 l -4 -1" fill="#4E9C58" stroke="#3F8F49" stroke-width="1.4" stroke-linejoin="round"></path>
        <ellipse cx="19" cy="20" rx="11" ry="9" fill="#3F8F49"></ellipse>
        <ellipse cx="19" cy="18.4" rx="11" ry="9" fill="#6EC978"></ellipse>
        <path d="M 10 15.5 Q 19 11 28 15.5" fill="none" stroke="#8FE09A" stroke-width="2" stroke-linecap="round"></path>
        <g stroke="#3F8F49" stroke-width="2">
          <path d="M 14 11 L 14 7.5"></path>
          <path d="M 24 11 L 24 7.5"></path>
        </g>
        <circle cx="14" cy="6" r="3.6" fill="#ffffff"></circle>
        <circle cx="24" cy="6" r="3.6" fill="#ffffff"></circle>
        <circle cx="14" cy="6" r="1.8" fill="#141414"></circle>
        <circle cx="24" cy="6" r="1.8" fill="#141414"></circle>
      </svg>
    </div>
  </sc-for>

  <!-- pirate: eyepatch for silhouette, light ring so he pops on sand and on crates alike -->
  <div style="position: absolute; left: {{player.cx}}px; top: {{player.cy}}px; transform: translate(-50%, -50%);">
    <svg width="40" height="40" viewBox="0 0 40 40">
      <ellipse cx="20" cy="34" rx="13" ry="3.6" fill="rgba(40,22,10,0.26)"></ellipse>
      <circle cx="20" cy="21" r="15.6" fill="none" stroke="rgba(46,28,14,0.30)" stroke-width="3.4"></circle>
      <circle cx="20" cy="21" r="15.6" fill="none" stroke="#FFF6E2" stroke-width="2"></circle>
      <circle cx="20" cy="24" r="12.4" fill="#9E3527"></circle>
      <path d="M 8 24 a 12.4 12.4 0 0 1 24 0 z" fill="#C44A3A"></path>
      <path d="M 12 26 L 28 26" stroke="#8C2F22" stroke-width="2.4" stroke-linecap="round"></path>
      <circle cx="20" cy="15.5" r="10" fill="#FFD6AA"></circle>
      <path d="M 10 13.5 a 10 10 0 0 1 20 0 z" fill="#C82828"></path>
      <path d="M 10 13.5 L 30 13.5" stroke="#A81F1F" stroke-width="2"></path>
      <path d="M 30 12 l 6 -3 l -1.5 5 z" fill="#C82828"></path>
      <path d="M 12.6 15.4 L 18.4 17.4" stroke="#241814" stroke-width="2" stroke-linecap="round"></path>
      <circle cx="15.4" cy="17.6" r="3.1" fill="#241814"></circle>
      <circle cx="24.4" cy="17.4" r="2.6" fill="#241814"></circle>
      <circle cx="25.3" cy="16.6" r="0.9" fill="#ffffff"></circle>
      <path d="M 15 21.6 Q 20 25.4 25 21.6" fill="none" stroke="#3C281E" stroke-width="2.4" stroke-linecap="round"></path>
    </svg>
  </div>

  <!-- HUD: one plank band, four labelled zones, no arbitrary pixel offsets -->
  <div style="position: absolute; left: 0; top: 0; width: 900px; height: 60px; display: flex; align-items: center; gap: 20px; padding: 0 18px; box-sizing: border-box; background: linear-gradient(180deg, #E9D29C 0%, #D8BA80 100%); box-shadow: inset 0 -3px 0 #8A6A44, 0 6px 14px rgba(12,50,72,0.34);">

    <div style="display: flex; align-items: center; gap: 8px; height: 34px; padding: 0 14px; border-radius: 17px; background: #322820; box-shadow: inset 0 -2px 0 rgba(0,0,0,0.28);">
      <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.14em; color: #C7A970;">LEVEL</span>
      <span style="font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-size: 21px; font-weight: 800; color: #FFF6E2; line-height: 1;">1<span style="color: #9C8562; font-size: 15px;">/5</span></span>
    </div>

    <div style="display: flex; align-items: center; gap: 5px;">
      <sc-for list="{{hearts}}" as="h" hint-placeholder-count="3">
        <svg width="27" height="25" viewBox="0 0 27 25">
          <path d="M 13.5 23.4 C 3 15.6 1 11.6 1 8.2 A 6.6 6.6 0 0 1 13.5 5.2 A 6.6 6.6 0 0 1 26 8.2 C 26 11.6 24 15.6 13.5 23.4 Z" fill="{{h.shade}}"></path>
          <path d="M 13.5 21.6 C 4 14.4 2.4 10.9 2.4 8.2 A 5.4 5.4 0 0 1 13.5 6.4 A 5.4 5.4 0 0 1 24.6 8.2 C 24.6 10.9 23 14.4 13.5 21.6 Z" fill="{{h.fill}}"></path>
          <ellipse cx="8.8" cy="9.4" rx="2.6" ry="1.9" fill="{{h.shine}}" transform="rotate(-28 8.8 9.4)"></ellipse>
        </svg>
      </sc-for>
    </div>

    <div style="display: flex; align-items: center; gap: 9px;">
      <svg width="26" height="26" viewBox="0 0 34 34">
        <circle cx="17" cy="18" r="12" fill="#A9720F"></circle>
        <circle cx="17" cy="16.6" r="12" fill="#DEA82E"></circle>
        <circle cx="17" cy="16.6" r="9.2" fill="#F7CE47"></circle>
        <circle cx="17" cy="16.6" r="6" fill="none" stroke="#C08D1C" stroke-width="1.9"></circle>
      </svg>
      <div style="display: flex; flex-direction: column; gap: 3px;">
        <span style="font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-size: 19px; font-weight: 800; color: #322820; line-height: 1;">{{coinsFound}}<span style="color: #8A6A44; font-size: 14px;">/{{coinsTotal}}</span></span>
        <div style="width: 96px; height: 6px; border-radius: 3px; background: rgba(88,62,34,0.28);">
          <div style="width: {{coinPct}}%; height: 6px; border-radius: 3px; background: linear-gradient(90deg, #F7CE47, #DEA82E);"></div>
        </div>
      </div>
    </div>

    <div style="flex-grow: 1;"></div>

    <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 1px;">
      <span style="font-size: 10px; font-weight: 800; letter-spacing: 0.14em; color: #8A6A44;">SCORE</span>
      <span style="font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-size: 24px; font-weight: 800; color: #322820; line-height: 1;">{{score}}</span>
    </div>

    <div style="display: flex; align-items: center; gap: 9px; padding-left: 18px; border-left: 2px solid rgba(88,62,34,0.22);">
      <svg width="32" height="32" viewBox="0 0 40 40">
        <circle cx="20" cy="20" r="16" fill="#FFF6E2"></circle>
        <circle cx="20" cy="23" r="12" fill="#C44A3A"></circle>
        <circle cx="20" cy="17" r="9.4" fill="#FFD6AA"></circle>
        <path d="M 10.6 15.4 a 9.4 9.4 0 0 1 18.8 0 z" fill="#C82828"></path>
        <circle cx="16.6" cy="19" r="2.4" fill="#241814"></circle>
        <circle cx="24" cy="19" r="2.4" fill="#241814"></circle>
      </svg>
      <span style="font-size: 15px; font-weight: 800; color: #322820;">Luc</span>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{"coins":{"editor":"int","default":3,"min":0,"max":8,"section":"HUD"},"lives":{"editor":"int","default":3,"min":0,"max":3,"section":"HUD"}}'>
class Component extends DCLogic {
  renderVals() {
    const GRID = [
      '#####################',
      '#P..........C.......#',
      '#.#.#.#.#.#.#.#~#.#.#',
      '#...C...#M..........#',
      '#.#.#C#.#.#.#.###.#.#',
      '#.........#....C..~C#',
      '###.#.#.#.#.#.#.###.#',
      '#..........C........#',
      '#.#C###.#.#.#~#.#.#M#',
      '#.........#.......#.#',
      '#.#.#.#.#.#.#.#.#.#.#',
      '#.........C.........#',
      '#####################'
    ];
    const T = 40, OX = 30, OY = 70;
    const walls = [], coins = [], puddles = [], monsters = [];
    GRID.forEach((row, r) => {
      row.split('').forEach((ch, c) => {
        const sx = OX + c * T, sy = OY + r * T;
        const cx = sx + T / 2, cy = sy + T / 2;
        if (ch === '#') walls.push({ sx, sy });
        else if (ch === 'C') coins.push({ cx, cy });
        else if (ch === '~') puddles.push({ cx, cy });
        else if (ch === 'M') monsters.push({ cx, cy });
      });
    });

    let seed = 1234;
    const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed / 0x7fffffff; };
    const specks = [];
    for (let i = 0; i < 91; i++) {
      specks.push({ x: Math.floor(rnd() * 840), y: Math.floor(rnd() * 520), d: 4 + Math.floor(rnd() * 5) });
    }

    const lives = Math.max(0, Math.min(3, this.props.lives ?? 3));
    const hearts = [0, 1, 2].map((i) => (i < lives
      ? { fill: '#E24B54', shade: '#A82530', shine: 'rgba(255,255,255,0.55)' }
      : { fill: '#D9CCC2', shade: '#B9A99C', shine: 'rgba(255,255,255,0.35)' }));

    const coinsTotal = coins.length;
    const coinsFound = Math.max(0, Math.min(coinsTotal, this.props.coins ?? 3));

    return {
      walls, coins, puddles, monsters, specks, hearts,
      coinsFound, coinsTotal,
      coinPct: coinsTotal ? Math.round((coinsFound / coinsTotal) * 100) : 0,
      score: coinsFound * 10,
      player: { cx: OX + 9 * T + 20, cy: OY + 7 * T + 20 }
    };
  }
}
</script>
</body>
</html>
