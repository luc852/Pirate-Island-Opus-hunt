<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800&display=swap">
  <style>
    body { margin: 0; background: #d8d3c8; }
    a { color: #b45309; } a:hover { color: #92400e; }
  </style>
</helmet>

<div style="position: relative; width: 900px; height: 600px; overflow: hidden; background: radial-gradient(120% 110% at 50% 46%, #4FA8CE 0%, #2E86AB 42%, #1B6389 100%); font-family: 'Nunito', 'Segoe UI', sans-serif;">

  <div style="position: absolute; left: 30px; top: 70px; width: 840px; height: 520px; border-radius: 20px; background: #EDC98A; box-shadow: 0 0 0 5px rgba(255,255,255,0.34), inset 0 0 26px rgba(178,138,84,0.55);"></div>
  <sc-for list="{{walls}}" as="w" hint-placeholder-count="60">
    <div style="position: absolute; left: {{w.sx}}px; top: {{w.sy}}px; width: 40px; height: 40px; border-radius: 11px; background: linear-gradient(180deg, #8A6647 0%, #6E5037 100%); box-shadow: 0 3px 0 #4E3625;"></div>
  </sc-for>

  <!-- overlay -->
  <div style="position: absolute; inset: 0; background: rgba(14,20,26,0.62);"></div>

  <!-- panel -->
  <div style="position: absolute; left: 190px; top: 132px; width: 520px; box-sizing: border-box; padding: 28px 34px 30px; border-radius: 24px; background: #FFFAEB; box-shadow: 0 6px 0 #A9720F, 0 22px 44px rgba(0,0,0,0.44); border: 4px solid #DEA82E;">

    <div style="display: flex; flex-direction: column; align-items: center; gap: 4px;">
      <svg width="52" height="52" viewBox="0 0 52 52">
        <circle cx="26" cy="26" r="24" fill="#E4F5E6"></circle>
        <path d="M 15 27 l 8 8 l 15 -17" fill="none" stroke="#3C9646" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"></path>
      </svg>
      <div style="font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-size: 42px; font-weight: 800; color: #3C9646; line-height: 1.1;">Island cleared!</div>
      <div style="font-size: 15px; font-weight: 700; color: #6B5A48;">Every coin found. Four islands still to raid.</div>
    </div>

    <!-- what was actually earned, replacing five decorative hearts -->
    <div style="margin-top: 20px; display: flex; flex-direction: column; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="22" height="22" viewBox="0 0 34 34">
          <circle cx="17" cy="18" r="12" fill="#A9720F"></circle>
          <circle cx="17" cy="16.6" r="12" fill="#DEA82E"></circle>
          <circle cx="17" cy="16.6" r="6" fill="none" stroke="#C08D1C" stroke-width="2"></circle>
        </svg>
        <span style="font-size: 15px; font-weight: 700; color: #322820;">Coins collected</span>
        <span style="font-size: 13px; font-weight: 700; color: #8A6A44;">8 &times; 10</span>
        <span style="flex-grow: 1;"></span>
        <span style="font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-size: 20px; font-weight: 800; color: #322820;">+80</span>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#DEA82E" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 12 3 l 2.6 5.6 l 6.1 0.8 l -4.5 4.2 l 1.2 6 l -5.4 -2.9 l -5.4 2.9 l 1.2 -6 l -4.5 -4.2 l 6.1 -0.8 z"></path>
        </svg>
        <span style="font-size: 15px; font-weight: 700; color: #322820;">Island clear bonus</span>
        <span style="flex-grow: 1;"></span>
        <span style="font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-size: 20px; font-weight: 800; color: #322820;">+50</span>
      </div>

      <div style="display: flex; align-items: center; gap: 10px;">
        <span style="font-size: 15px; font-weight: 700; color: #322820;">Lives left</span>
        <span style="display: flex; gap: 3px;">
          <sc-for list="{{hearts}}" as="h" hint-placeholder-count="3">
            <svg width="20" height="19" viewBox="0 0 27 25">
              <path d="M 13.5 23.4 C 3 15.6 1 11.6 1 8.2 A 6.6 6.6 0 0 1 13.5 5.2 A 6.6 6.6 0 0 1 26 8.2 C 26 11.6 24 15.6 13.5 23.4 Z" fill="{{h.shade}}"></path>
              <path d="M 13.5 21.6 C 4 14.4 2.4 10.9 2.4 8.2 A 5.4 5.4 0 0 1 13.5 6.4 A 5.4 5.4 0 0 1 24.6 8.2 C 24.6 10.9 23 14.4 13.5 21.6 Z" fill="{{h.fill}}"></path>
            </svg>
          </sc-for>
        </span>
        <span style="flex-grow: 1;"></span>
      </div>

      <div style="height: 2px; background: rgba(88,62,34,0.16); border-radius: 1px;"></div>

      <div style="display: flex; align-items: baseline; gap: 10px;">
        <span style="font-size: 12px; font-weight: 800; letter-spacing: 0.12em; color: #8A6A44;">TOTAL SCORE</span>
        <span style="flex-grow: 1;"></span>
        <span style="font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-size: 34px; font-weight: 800; color: #DEA82E; line-height: 1;">130</span>
      </div>
    </div>

    <!-- run progress, the thing the five fake hearts were standing in for -->
    <div style="margin-top: 20px; display: flex; align-items: center; gap: 8px;">
      <span style="font-size: 11px; font-weight: 800; letter-spacing: 0.12em; color: #8A6A44;">VOYAGE</span>
      <span style="display: flex; gap: 5px; flex-grow: 1;">
        <sc-for list="{{islands}}" as="i" hint-placeholder-count="5">
          <span style="flex-grow: 1; height: 8px; border-radius: 4px; background: {{i.fill}};"></span>
        </sc-for>
      </span>
      <span style="font-size: 12px; font-weight: 800; color: #8A6A44;">1 / 5</span>
    </div>

    <div style="margin-top: 22px; display: flex; justify-content: center;">
      <div style="display: flex; align-items: center; justify-content: center; gap: 9px; width: 224px; height: 56px; border-radius: 18px; background: linear-gradient(180deg, #F7CE47 0%, #DEA82E 100%); box-shadow: 0 5px 0 #A9720F, 0 12px 20px rgba(0,0,0,0.28); border: 3px solid #7A4E12; box-sizing: border-box;">
        <span style="font-family: 'Baloo 2', 'Trebuchet MS', sans-serif; font-size: 24px; font-weight: 800; color: #322820;">Set sail</span>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#322820" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
          <path d="M 5 12 h 13"></path>
          <path d="M 13 6 l 6 6 l -6 6"></path>
        </svg>
      </div>
    </div>
  </div>

</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    const GRID = [
      '#####################',
      '#P..........C.......#',
      '#.#.#.#.#.#.#.#~#.#.#',
      '#...C...#M..........#',
      '#.#.#C#.#.#.#.###.#.#',
      '#.........#....C..~C#',
      '###.#.#.#.#.#.#.###.#',
      '#..........C........#',
      '#.#C###.#.#.#~#.#.#M#',
      '#.........#.......#.#',
      '#.#.#.#.#.#.#.#.#.#.#',
      '#.........C.........#',
      '#####################'
    ];
    const T = 40, OX = 30, OY = 70;
    const walls = [];
    GRID.forEach((row, r) => {
      row.split('').forEach((ch, c) => {
        if (ch === '#') walls.push({ sx: OX + c * T, sy: OY + r * T });
      });
    });
    const hearts = [0, 1, 2].map(() => ({ fill: '#E24B54', shade: '#A82530' }));
    const islands = [0, 1, 2, 3, 4].map((i) => ({ fill: i < 1 ? '#DEA82E' : 'rgba(88,62,34,0.18)' }));
    return { walls, hearts, islands };
  }
}
</script>
</body>
</html>
